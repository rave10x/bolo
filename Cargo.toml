[package]
name = "bolo"
version = "0.1.0"
edition = "2021"
description = "Offline English practice for Hindi speakers - Hinglish lessons, words, speaking"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
rust-embed = "8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "time"] }

[profile.release]
opt-level = 3
strip = true
lto = "thin"
