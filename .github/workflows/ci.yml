name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Dioxus desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Content is valid and committed
        run: |
          python3 -I tools/build.py
          python3 -I tools/en_build.py
          git diff --exit-code content/
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Installer scripts parse
        run: bash -n install.sh && bash -n scripts/install-ai.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Installer script parses
        shell: pwsh
        run: |
          foreach ($f in 'install.ps1','scripts/install-ai.ps1') {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs; exit 1 }
          }
